name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Derleme hatalarini goster
        if: failure()
        run: |
          PREFIX="file:///home/runner/work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}/app/src/main/java/com/fatih/futuresbot/"
          grep -E '^e: ' build.log | sed "s#${PREFIX}##" | head -15 > errors.txt || true
          if [ ! -s errors.txt ]; then
            grep -A3 'What went wrong' build.log | head -15 > errors.txt || true
          fi
          {
            echo "## Derleme hatalari"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::error::${line}"; fi
          done < errors.txt

      - uses: actions/upload-artifact@v6
        with:
          name: futures-bot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
